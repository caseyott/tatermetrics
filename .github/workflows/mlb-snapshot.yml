name: MLB daily snapshot

# Manual/backfill trigger only — the daily run itself is now handled by a
# Lambda + EventBridge Scheduler (terraform/modules/lambda_snapshot), which
# runs on a named timezone (no UTC/DST cron math) and doesn't depend on
# GitHub's shared-runner scheduler actually firing. This workflow used to
# also run on a `schedule:` trigger, but that cron reliably failed to fire
# (including on its very first scheduled occurrence), which is what drove
# the move to Lambda. Kept around for manual re-runs and backfills — uploads
# a small wins/losses snapshot to S3. app.js reads yesterday's file the next
# day to flag magic numbers that dropped. Re-running for the same day just
# overwrites that day's file — safe.
#
# Requires two repo Actions variables (Settings > Actions > Variables),
# matching terraform/outputs.tf:
#   AWS_ROLE_ARN       - module.github_oidc.deploy_role_arn
#   CF_DISTRIBUTION_ID - module.cloudfront.cloudfront_distribution_id

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  BUCKET_NAME: tatermetrics.tatertech.net
  SNAPSHOT_PREFIX: mlb/data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate snapshot
        run: node mlb/scripts/snapshot.js ./out

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload snapshot to S3
        run: |
          aws s3 cp ./out/ "s3://${BUCKET_NAME}/${SNAPSHOT_PREFIX}/" \
            --recursive \
            --content-type application/json \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache for the new snapshot
        if: ${{ vars.CF_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/${SNAPSHOT_PREFIX}/*"
